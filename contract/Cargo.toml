[package]
name = "sealed-market-contract"
version = "0.1.0"
edition = "2021"
description = "Sealed Market: Private Data Marketplace on NEAR with TEE Attestation, NEP-245 Multi-Token Entitlements, Escrow, and Shapley Settlements"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# // VERIFY: https://docs.near.org/build/smart-contracts/quickstart
near-sdk = { version = "=5.30.1", features = ["legacy"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing", "legacy"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
